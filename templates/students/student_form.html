<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;

    font-family: "Inter", "Segoe UI", sans-serif;

    background:
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.25), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.2), transparent 30%),
        #f4f7ff;
}

/* Main card */

.form-wrapper {
    width: 100%;
    max-width: 500px;
    padding: 42px;

    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 26px;

    box-shadow:
        0 25px 60px rgba(71, 85, 150, 0.15),
        0 5px 15px rgba(71, 85, 150, 0.06);
}

/* Header */

.form-header {
    margin-bottom: 30px;
}

.badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 11px;

    border-radius: 20px;

    background: #eef2ff;
    color: #6366f1;

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

h1 {
    color: #172033;
    font-size: 32px;
    font-weight: 750;
    margin-bottom: 8px;
}

.form-header p {
    color: #7b8499;
    font-size: 14px;
}

/* Django form */

form p {
    margin-bottom: 18px;
}

form label {
    display: block;
    margin-bottom: 7px;

    color: #374151;
    font-size: 14px;
    font-weight: 600;
}

/* Inputs */

input,
textarea,
select {
    width: 100%;
    padding: 14px 16px;

    border: 1.5px solid #dfe4ef;
    border-radius: 12px;

    background: rgba(255, 255, 255, 0.9);

    color: #1e293b;
    font-family: inherit;
    font-size: 14px;

    outline: none;

    transition: 0.25s ease;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input::placeholder,
textarea::placeholder {
    color: #a3acbd;
}

input:hover,
textarea:hover,
select:hover {
    border-color: #a5b4fc;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #6366f1;

    background: #ffffff;

    box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.1);

    transform: translateY(-1px);
}

/* Button */

button {
    width: 100%;
    margin-top: 5px;
    padding: 15px 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #6366f1,
        #06b6d4
    );

    color: white;

    font-family: inherit;
    font-size: 15px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(79, 70, 229, 0.22);

    transition: 0.25s ease;
}

button span {
    font-size: 20px;
    transition: 0.25s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(79, 70, 229, 0.3);
}

button:hover span {
    transform: translateX(4px);
}

button:active {
    transform: translateY(0);
}

/* View students link */

.view-link {
    display: block;
    margin-top: 22px;

    text-align: center;

    color: #6366f1;
    font-size: 14px;
    font-weight: 600;

    text-decoration: none;

    transition: 0.2s ease;
}

.view-link:hover {
    color: #0891b2;
}

/* Mobile */

@media (max-width: 600px) {
    body {
        padding: 18px;
    }

    .form-wrapper {
        padding: 28px 22px;
        border-radius: 20px;
    }

    h1 {
        font-size: 27px;
    }
}
    </style>
</head>
<body>
  <body>
    <div class="form-wrapper">

        <div class="form-header">
            <span class="badge">STUDENT PORTAL</span>
            <h1>Add Student</h1>
            <p>Enter the student's information below.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Student
                <span>→</span>
            </button>
        </form>

        <a class="view-link" href="{% url 'student_list' %}">
            View all students →
        </a>

    </div>
</body>
</body>
</html>
