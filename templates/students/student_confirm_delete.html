<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: "Inter", "Segoe UI", sans-serif;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(99, 102, 241, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(6, 182, 212, 0.15),
                    transparent 30%
                ),
                #f7f9fc;
        }

        .delete-card {
            width: min(100%, 440px);
            padding: 42px;

            text-align: center;

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(30, 41, 80, 0.12);
        }

        /* Icon */

        .delete-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 18px;

            background: #fff1f2;
            color: #e11d48;

            font-size: 28px;
        }

        /* Heading */

        h1 {
            margin-bottom: 12px;

            color: #172033;

            font-size: 28px;
            letter-spacing: -0.6px;
        }

        /* Description */

        .warning-text {
            margin-bottom: 28px;

            color: #7b8499;

            font-size: 14px;
            line-height: 1.7;
        }

        .student-name {
            color: #172033;
            font-weight: 700;
        }

        /* Warning box */

        .warning-box {
            margin-bottom: 25px;
            padding: 13px 15px;

            border-radius: 11px;

            background: #fff7ed;
            border: 1px solid #fed7aa;

            color: #c2410c;

            font-size: 13px;
            line-height: 1.5;
        }

        /* Buttons */

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .delete-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 11px;

            background: #e11d48;
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 650;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .delete-btn:hover {
            background: #be123c;
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(225, 29, 72, 0.2);
        }

        .cancel-btn {
            display: block;
            width: 100%;
            padding: 14px;

            border-radius: 11px;

            background: #f1f5f9;
            color: #475569;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition: all 0.25s ease;
        }

        .cancel-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* Mobile */

        @media (max-width: 500px) {
            .delete-card {
                padding: 30px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <body>

    <div class="delete-card">
        <h1>Delete Student?</h1>

        <p>
            Are you sure you want to delete
            <strong>
                {{ student.first_name }} {{ student.last_name }}
            </strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">Yes, Delete</button>

            <a href="{% url 'student_list' %}">
                Cancel
            </a>
        </form>
    </div>

</body>
</body>
</html>
