<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Creation Form</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b0b0f, #1a0b0b, #300808);
    color: white;
}

/* Form title */
h1 {
    position: absolute;
    top: 20px;
    text-align: center;
    font-size: 32px;
    letter-spacing: 1px;
    color: #fff;
}

/* Form container */
form {
    width: 420px;
    padding: 35px;
    display: flex;
    flex-direction: column;
    gap: 22px;

    background: rgba(20, 20, 25, 0.85);
    border: 1px solid rgba(255, 60, 60, 0.35);
    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(255, 0, 0, 0.12),
        0 20px 50px rgba(0, 0, 0, 0.5);

    backdrop-filter: blur(12px);
}

/* Each label */
label {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

label > span:first-child {
    font-size: 14px;
    font-weight: 600;
    color: #ddd;
}

/* Input wrapper */
label > span:last-child {
    display: block;
}

/* Inputs */
input {
    width: 100%;
    padding: 14px 16px;

    background: #111116;
    color: white;

    border: 1px solid #393940;
    border-radius: 10px;

    outline: none;
    font-size: 14px;

    transition: 0.3s ease;
}

input::placeholder {
    color: #777;
}

/* Input focus */
input:focus {
    border-color: #ff3030;
    box-shadow: 0 0 0 3px rgba(255, 48, 48, 0.12);
    background: #16161c;
}

/* Submit button */
button {
    margin-top: 8px;
    padding: 14px;

    border: none;
    border-radius: 10px;

    background: linear-gradient(135deg, #ff3030, #b80000);
    color: white;

    font-size: 15px;
    font-weight: bold;
    cursor: pointer;

    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
}

button:active {
    transform: translateY(0);
}
p {
    width: fit-content;
    margin: 20px auto;
    padding: 12px 20px;

    color: #fff;
    background: rgba(255, 48, 48, 0.12);

    border: 1px solid rgba(255, 48, 48, 0.5);
    border-radius: 10px;

    font-size: 14px;
    font-weight: 500;
    text-align: center;

    box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
}

/* Mobile */
@media (max-width: 500px) {
    h1 {
        top: 35px;
        font-size: 25px;
    }

    form {
        width: 90%;
        padding: 25px;
    }
}
    </style>
</head>
<body> 
    <h1>User Creation Form</h1>
    <form action="" method="post">
        
        {%csrf_token%}
         {%for message in messages %} <br />
         <p>{{message}}</p>
          {% endfor %}
        <label for="username">
            <span>Username: </span>
            <span>
                <input type="text" id="username" placeholder="Enter Username" name="username">
            </span>
        </label>
        <label for="email">
            <span>email: </span>
            <span>
                <input type="text" id="email" placeholder="Enter email" name="email">
            </span>
        </label>
         <label for="password">
            <span>Password: </span>
            <span>
                <input type="text" id="password" placeholder="Enter password" name="password">
            </span>
        </label>
         <label for="confirm_password">
            <span>Cofirm Password: </span>
            <span>
                <input type="text" id="confirm_password" placeholder="Confirm Password" name="confirm_password">
            </span>
        </label>
        <button type="submit">Submit</button>
        <p>Already have an acc <a href="{%url 'login'%}">Login</a></p>
    </form>
    
</body>
</html>
